<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leviathan</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="wordmark">Leviathan</h1>
      <div class="file" id="file-info" hidden>
        <span class="name" id="file-name"></span>
        <span class="facts" id="file-facts"></span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot" data-state="pending"></span>
        <span id="status-text">Starting engine…</span>
      </div>
    </header>

    <div class="toolbar">
      <button type="button" id="pick">Open file…</button>
      <input type="file" id="file" accept=".json,.ndjson,.jsonl,application/json" hidden />

      <nav class="crumbs" id="crumbs" aria-label="Path to the selected row"></nav>

      <div class="indexing" id="indexing" hidden>
        <div class="progress" role="progressbar" aria-labelledby="index-state">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="state" id="index-state"></span>
        <button type="button" id="cancel">Stop</button>
      </div>
    </div>

    <!--
      The tree. `role="tree"` sits on the scrolling element and the rows carry
      `aria-level` / `aria-posinset` / `aria-setsize` themselves, because only a
      window's worth of rows exists in the DOM at any moment — the accessibility
      tree is told the shape of the whole list even though the document only
      ever holds the part of it you can see.
    -->
    <main
      class="viewport"
      id="viewport"
      tabindex="0"
      role="tree"
      aria-label="JSON tree"
      aria-busy="false"
      hidden
    >
      <div class="canvas" id="canvas"></div>
    </main>

    <section class="empty" id="empty">
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>Drop a <code>.json</code> or <code>.ndjson</code> file</strong>
        <span class="or">or</span>
        <button type="button" id="pick-empty">Choose a file…</button>
        <p class="prose">
          Nothing is uploaded and nothing is read whole. The engine holds a handle to the
          file and pulls byte ranges out of it as you scroll, which is why size does not
          dictate memory use.
        </p>
      </div>
      <label class="field">
        <span>…or paste JSON</span>
        <textarea id="paste" rows="3" spellcheck="false" placeholder='{"leviathan":true}'></textarea>
      </label>
    </section>

    <footer class="bar">
      <div class="selection" id="selection">
        <span class="hint">Select a row to see its path and offset.</span>
      </div>
      <div class="actions">
        <button type="button" id="copy-path" disabled>Copy path</button>
        <button type="button" id="copy-value" disabled>Copy value</button>
      </div>
      <output class="result" id="notice" aria-live="polite"></output>
      <span id="engine-version">engine —</span>
    </footer>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
