# CI for Leviathan.
#
# Two jobs, split by what they prove:
#
#   engine — the Rust core is correct, conformant, robust, and still portable.
#   shell  — the WASM package builds, runs, and fits the bundle budget.
#
# The layering check lives in `engine` on purpose: "the core is reusable" is a
# property of the core, and it should fail there rather than downstream.
#
# Two of M1's exit criteria are gates here rather than things someone runs by
# hand — conformance against JSONTestSuite, and fuzzing for panics and
# chunk-boundary disagreements. A criterion that is only checked when remembered
# is not a criterion.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just clippy's own lints.
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # M1 exit criterion 5. Pinned to a commit rather than tracking master:
      # a conformance gate that can go red because someone else added a case
      # is a gate that gets ignored, and then removed.
      #
      # Only `test_parsing` is extracted — the rest of that repository is other
      # people's parsers, and it is 50 MB of them.
      - name: Fetch conformance corpus
        env:
          CORPUS_SHA: 1ef36fa01286573e846ac449e8683f8833c5b26a
        run: |
          mkdir -p fixtures/generated/JSONTestSuite
          curl -sSLf "https://codeload.github.com/nst/JSONTestSuite/tar.gz/$CORPUS_SHA" -o /tmp/corpus.tar.gz
          tar -xzf /tmp/corpus.tar.gz -C fixtures/generated/JSONTestSuite \
            --strip-components=1 --wildcards '*/test_parsing/*'
          ls fixtures/generated/JSONTestSuite/test_parsing/*.json | wc -l

      # Fails on an undocumented disagreement *and* on an exemption that no
      # longer applies — a stale exemption is a false claim about the engine.
      - name: Conformance (RFC 8259)
        run: cargo run --release --package leviathan-cli -- conformance

      # M1 exit criterion 4. The seed varies per run so CI explores new ground
      # over time; the report prints it, so any failure is reproducible with
      # `leviathan fuzz --seed <n>`.
      - name: Fuzz the lexer
        run: |
          cargo run --release --package leviathan-cli -- \
            fuzz --seconds 60 --seed ${{ github.run_number }}

      # The contract that keeps leviathan-core publishable on its own:
      # no wasm-bindgen, no async runtime, no I/O. See DEEP_REASONING.md C2.
      - name: Layering contract
        run: bash scripts/check-layering.sh

      # docs.rs has to build clean before M7 can publish; catching a broken
      # intra-doc link now is cheaper than catching it at release.
      - name: Docs
        run: cargo doc --package leviathan-core --no-deps

  shell:
    name: shell (wasm + typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must precede typecheck: the WASM package's .d.ts is generated, not
      # committed, and the Worker imports it.
      - name: Build WASM package
        run: pnpm build:wasm

      - name: Smoke-test the engine
        run: pnpm -C packages/extension smoke

      - name: Typecheck
        run: pnpm typecheck

      # Also enforces the ≤150 KB gz JS/CSS budget (SPEC §M2).
      - name: Build extension
        run: pnpm build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: leviathan-unpacked
          path: packages/extension/dist
          if-no-files-found: error
