[package]
name = "leviathan-wasm"
description = "WebAssembly bindings for leviathan-core: streaming JSON indexing for files too large to parse."
categories = ["wasm", "parser-implementations"]
keywords = ["json", "wasm", "streaming", "ndjson"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leviathan-core.workspace = true
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# wasm-opt tuned for size: the .wasm ships inside a browser extension.
wasm-opt = ["-Oz", "--enable-bulk-memory"]
